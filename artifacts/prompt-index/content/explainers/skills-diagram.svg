<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <!-- request chip -->
  <rect x="30" y="40" width="230" height="44" rx="8" fill="none" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="145" y="67" fill="#e8e8e8" font-size="14" text-anchor="middle">"make me a flyer"</text>
  <text x="30" y="26" fill="#777777" font-size="11">YOU ASK</text>

  <!-- shelf label -->
  <text x="420" y="26" fill="#777777" font-size="11">YOUR SKILLS</text>

  <!-- folder 1: brand-flyers (match) -->
  <g>
    <path d="M420 44 h34 l10 10 h76 v58 h-120 z" fill="none" stroke="#ff5c00" stroke-width="2"/>
    <text x="480" y="78" fill="#ff5c00" font-size="12" text-anchor="middle">brand-flyers</text>
    <text x="480" y="98" fill="#999999" font-size="10" text-anchor="middle">use for: flyers</text>
  </g>

  <!-- folder 2: quote-emails -->
  <g>
    <path d="M560 44 h34 l10 10 h76 v58 h-120 z" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="620" y="78" fill="#bbbbbb" font-size="12" text-anchor="middle">quote-emails</text>
    <text x="620" y="98" fill="#777777" font-size="10" text-anchor="middle">use for: quotes</text>
  </g>

  <!-- folder 3: client-updates -->
  <g>
    <path d="M560 130 h34 l10 10 h76 v58 h-120 z" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="620" y="164" fill="#bbbbbb" font-size="12" text-anchor="middle">client-updates</text>
    <text x="620" y="184" fill="#777777" font-size="10" text-anchor="middle">use for: updates</text>
  </g>

  <!-- arrow: request to matching folder -->
  <path d="M260 62 C 330 62, 350 72, 412 72" fill="none" stroke="#ff5c00" stroke-width="2"/>
  <path d="M404 66 l10 6 l-10 6 z" fill="#ff5c00"/>
  <text x="316" y="52" fill="#ff5c00" font-size="10">matches</text>

  <!-- arrow: folder opens -->
  <path d="M480 112 C 480 165, 400 185, 308 206" fill="none" stroke="#ff5c00" stroke-width="2"/>
  <path d="M316 198 l-14 11 l16 3 z" fill="#ff5c00"/>
  <text x="420" y="218" fill="#ff5c00" font-size="10">opens and reads</text>

  <!-- open SKILL.md panel -->
  <rect x="60" y="210" width="240" height="150" rx="6" fill="none" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="76" y="236" fill="#e8e8e8" font-size="12">SKILL.md</text>
  <line x1="76" y1="248" x2="284" y2="248" stroke="#3a3a3a" stroke-width="1"/>
  <text x="76" y="270" fill="#ff5c00" font-size="11">use this when: flyers</text>
  <rect x="76" y="284" width="190" height="7" rx="3.5" fill="#3a3a3a"/>
  <rect x="76" y="300" width="160" height="7" rx="3.5" fill="#3a3a3a"/>
  <rect x="76" y="316" width="180" height="7" rx="3.5" fill="#3a3a3a"/>
  <rect x="76" y="332" width="120" height="7" rx="3.5" fill="#3a3a3a"/>
  <text x="60" y="200" fill="#777777" font-size="11">YOUR RULES, READ IN FULL</text>

  <!-- result note -->
  <text x="360" y="300" fill="#e8e8e8" font-size="13">the flyer comes back</text>
  <text x="360" y="322" fill="#e8e8e8" font-size="13">in your colours, your fonts,</text>
  <text x="360" y="344" fill="#e8e8e8" font-size="13">your wording - first go</text>
</svg>
