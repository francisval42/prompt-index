openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: payments
    description: Payment portal operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /pay/config:
    get:
      operationId: getPayConfig
      tags: [payments]
      summary: Payment portal configuration
      description: Returns the Stripe publishable key used to render the payment form
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayConfig"
  /pay/intent:
    post:
      operationId: createPayIntent
      tags: [payments]
      summary: Create a payment intent
      description: Creates a Stripe PaymentIntent for a custom AUD amount with an optional reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayIntentInput"
      responses:
        "201":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayIntent"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PayConfig:
      type: object
      properties:
        publishableKey:
          type: string
      required:
        - publishableKey
    PayIntentInput:
      type: object
      properties:
        amountCents:
          type: integer
          minimum: 100
          maximum: 1000000
          description: Amount in AUD cents (A$1.00 to A$10,000.00)
        reference:
          type: string
          maxLength: 200
          description: Optional reference attached to the payment
      required:
        - amountCents
    PayIntent:
      type: object
      properties:
        clientSecret:
          type: string
      required:
        - clientSecret
    ApiErrorMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error
